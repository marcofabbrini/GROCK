name: Aggiorna dati impianto

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora, al minuto 17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica i dati
        env:
          FV_KEY: ${{ secrets.FV_KEY }}
        run: python scripts/aggiorna.py
      - name: Salva se cambiato
        run: |
          git config user.name "grock-bot"
          git config user.email "grock-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Aggiornamento dati $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
